<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VietQR – MB Bank · Tô Quang Huy</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #f7fafc, #e8eef5);
      color: #0f172a;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 28px 24px 32px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
      text-align: center; max-width: 420px; width: calc(100% - 32px);
    }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    .bank { color: #d70018; font-weight: 700; letter-spacing: .02em; }
    .meta { font-size: .95rem; line-height: 1.55; color: #334155; margin: 12px 0 18px; }
    .meta strong { color: #0f172a; }
    img { width: min(100%, 320px); height: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
    .hint { margin-top: 14px; font-size: .85rem; color: #64748b; }
    @media print {
      body { background: #fff; }
      .card { box-shadow: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Quét mã để chuyển khoản</h1>
    <div class="bank">MB Bank</div>
    <div class="meta">
      Số TK: <strong>0788415516</strong><br>
      Chủ TK: <strong>TÔ QUANG HUY</strong>
    </div>
    <img src="/image/vietqr_mb_toquanghuy.png" alt="VietQR MB Bank - To Quang Huy">
    <p class="hint">Mở app ngân hàng → Quét VietQR → Kiểm tra tên người nhận trước khi chuyển.</p>
  </div>
</body>
</html>
