name: CI - Shop Hades Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: shop_hades_test
          MYSQL_USER: hades_test
          MYSQL_PASSWORD: hades_test_password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhades_test -phades_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, pdo_mysql, bcmath, gd, fileinfo
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Create Test Environment
      run: cp .env.example .env

    - name: Run PHPUnit Tests
      run: ./vendor/bin/phpunit
